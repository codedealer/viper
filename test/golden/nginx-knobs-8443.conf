# viper: loopback web vhost — reached only via Xray Reality-fail fallback (dest).
# Managed by viper; do not edit by hand (re-rendered on deploy).
server {
    listen 127.0.0.1:9443 ssl http2;
    server_name proxy.example.org;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/proxy.example.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/proxy.example.org/privkey.pem;

    location = / {
        root /var/www/viper/alt;
    }
    location = /index.html {
        root /var/www/viper/alt;
    }
    location = /login {
        alias /var/www/viper/alt/index.html;
    }
    location = /00112233445566778899aabbccddeeff/sub.txt {
        alias /var/www/viper/alt/sub.txt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
