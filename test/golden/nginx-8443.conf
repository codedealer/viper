# viper: loopback web vhost — reached only via Xray Reality-fail fallback (dest).
# Managed by viper; do not edit by hand (re-rendered on deploy).
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name vpn.example.com;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/vpn.example.com/privkey.pem;

    location = / {
        root /var/www/viper/main;
    }
    location = /index.html {
        root /var/www/viper/main;
    }
    location = /login {
        alias /var/www/viper/main/index.html;
    }
    location = /deadbeefcafebabe1234567890abcdef/sub.txt {
        alias /var/www/viper/main/sub.txt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
