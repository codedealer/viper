# viper: ACME HTTP-01 challenges only — 404 for everything else.
# Managed by viper; do not edit by hand (re-rendered on deploy).
server {
    listen 80;
    server_name proxy.example.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 404;
    }
}
